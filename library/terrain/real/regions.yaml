# A library of real bases: areas by landform type and the type's requirements for a 400 m window (per the analysis in
# components/site/terrain_analysis.py). Heights — USGS 3DEP (lidar, 1 m step; public domain). Assembled by
# components/site/terrain_library.py; windows — <type>/<name>.npz.
#
# Requirements (all optional):
#   relief: [from, to]      — the window's height range, m (p98 − p2)
#   steep: [from, to]       — the share of cells steeper than 40°
#   slope50: [from, to]     — the median slope, °
#   flat_max: fraction      — the share of the "flat" form (geomorphons, L = 20 m) at most
#   stream: {r, area}       — the main stream passes closer than r m to the center, with a catchment there ≥ area m²
#   saddle: {r, drop}       — a saddle closer than r m to the center, drop ≥ drop m
#   summit: {r, rel, top}   — a summit closer than r m, the drop to its surroundings ≥ rel m, a flat top ≥ top m²
#   bowl: {r, rel}          — a bowl closer than r m, depth ≥ rel m
#   sea: [from, to]         — the share of cells below 0.5 m above the sea (a shore)
#   rough_min: m            — fine texture (a remainder finer than ~5 m) — filters out smoothed sources (default 0.05)
# Selection score — score: [field, …] (higher is better): relief, steep, stream_area, saddle_drop, summit_rel, bowl_rel, rough.

types:
  canyon:
    title: a canyon in a plateau
    presets: [desert_canyon]
    need: {relief: [40, 260], steep: [0.06, 0.7], stream: {r: 60, area: 20000}}
    score: [relief, steep]
    regions:
      - [canyonlands_needles, 38.15, -109.80]
