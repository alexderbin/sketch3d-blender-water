name: tell_plain
title: Tell on a plain — the mound of an ancient town, the lower town, "hollow ways"
biome: desert
cases: [town on a tell, siege of the tell, caravan to the town, excavation, view from the tell over the plain]
knobs: {face: [0, 359], h: [12, 28], rx: [60, 95], ry: [45, 70], lower_r: [140, 200]}
relief:
  size: 600
  res: 0.75
  ground: sand
  erosion: {amount: 0.2}
