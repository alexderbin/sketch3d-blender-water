name: alpine_pass
title: Mountain pass
biome: alpine
cases: [squad crossing a saddle, ambush at the pass, defense of the saddle, blizzard]
knobs: {face: [0, 359], h: [55, 90], length: [300, 380], width: [80, 120], peaks: [3, 6], snowline: [22, 40]}
relief:
  size: 380
  ground: snow
  snowline: "{snowline}"
  use:
    - {type: pass, id: pass, at: [0, 0], face: "{face}", h: "{h}", length: "{length}", w: "{width}"}
  generate:
    - {gen: hill, id: peak, n: "{peaks}", area: {ring: [150, 185]}, params: {r: [35, 60], h: [8, 16], shape_choice: [dome, bell, bell], jag: 0.2}, gap: 0.6}   # moraine mounds: a free-standing hill is not a mountain (terrain.hill_law)
  far: {h: 240, kind: ridged, start: 1.3, peak: 2.6}
views:                             # the preset's cameras — for its scenarios (the points are the site's anchors)
  - {name: wide, from: pass.below, h: 45, look: pass.saddle, look_h: 10, lens: 26, back: 60}
  - {name: saddle_from_below, from: pass.climb, h: 1.6, look: pass.saddle, look_h: 3, lens: 30}
  - {name: ambush_from_crest, from: pass.crest_l, h: 2, look: pass.climb, look_h: 1.5, lens: 32}
  - {name: down_from_saddle, from: pass.saddle, h: 1.7, look: pass.descent, look_h: 0, lens: 28}
