# Site dressing: the biome's ecotope — layers from large to small (components/site/terrain_dress.py). The rules:
# big rocks — on the brow of drops, large vegetation — in gullies, small things — on flat ground away from drops (a survey
# of 88 maps); forest along valleys, sparser on open hills; species share the ground; scree — at the foot of a drop
# (geology); density from world maps, a pattern with the asset's footprint, large before small.
#
# Layer: id; kind — rock | tree (bl_relief models: rocks, "clump" trees; mix — tree species); facet — faceted rocks
# (outcrops in walls, flat faces); size — [from, to], m (the diameter of a stone or the height of a tree); foot —
# footprint, m (the pattern step and the distance to neighbors); base — the share of pattern cells at multiplier 1;
# density multipliers (all optional):
#   slope: [[°, w] …]          — a piecewise-linear curve by slope
#   brow / foot_of_cliff / cliff: w — at the brow of a drop (≤ 3 m) / at its foot (≤ 3 m) / on the drop (steeper than 40°)
#   brow_only / foot_only: true — only at the brow / only at the foot (otherwise 0)
#   forms: {form: w}           — by geomorphon (flat, peak, ridge, shoulder, spur, slope, hollow, footslope, valley, pit)
#   flow: [[lg of area, w] …]   — by catchment (lg m²): drainage gullies
#   dwater / droad: [[m, w] …]  — by distance to water / road
#   noise: {scale: m, amp}      — patches (1 + amp·noise, not less than 0)
#   clear: m                    — a clearing around story anchors; flat ground (flat) — the multiplier flat: w
#   below_snow: true            — below the snow line
# children: {of: layer, n: [from, to], r: [from, to] (in parent footprints)} — children around the parents of the layer "of"
# (stones by a boulder, bushes at a forest edge).
# sink — the share of the size sunk into the ground; tilt — along the ground normal (0…1).

# Settlement land (the site maps an_use, an_works — terrain.data_maps; only for sites with a settlement, others are not
# affected).
# Arable land and pasture — within the nearest kilometer of the settlement (Chisholm 1962; site catchment — Vita-Finzi,
# Higgs 1970): forest remains where it is not plowed — on steep ground (ravine slopes, brows) and in a strip by water;
# pasture has sparse trees. On man-made features (rampart, ditch, mound, quarry, spoil heap, dike) there are no trees or
# bushes: a fortification is kept open. Stones are cleared from the fields (on flat ground — a share of rocks).
settle:
  open: 0.04                                      # sparse trees and bushes on pasture
  keep: {slope: [[12, 0], [22, 1]], dwater: [[0, 1], [12, 1], [25, 0]]}   # where forest remains: steep ground; by water
  rocks: {ids: [boulders, stones], k: 0.3, flat_below: 15}                 # on flat cultivated ground — fewer stones
  works: {tree: 0.0}                              # a multiplier on the man-made footprint by layer kind

# The mountain belt (the Site step rocks, terrain_rocks.py): far away — only large things (small ones are thinner than a
# pixel). The maps are an analysis of the belt mesh (terrain_tex.far_analysis). Slope geology (Selby 1993 "Hillslope
# Materials and Processes"): walls — on steeps (bedrock facing out); outcrops — on convex ground (ridges, shoulders,
# spurs: thin soil); boulders — in hollows, at the feet and under drops (material carried downslope). The inputs:
# slope, curvature, drainage.
belt:
  layers:
    - {id: cliffs, kind: rock, size: [8, 18], foot: 18, base: 0.22, slope: [[0, 0], [36, 0], [44, 1], [90, 1]], noise: {scale: 140, amp: 0.8},
       sink: 0.45, tilt: 1.0}
    - {id: outcrops, kind: rock, size: [6, 13], foot: 22, base: 0.22, slope: [[0, 0], [18, 0.2], [28, 1], [40, 1], [48, 0.3]],
       forms: {ridge: 2.0, shoulder: 1.7, spur: 1.6, peak: 1.5, slope: 0.5, hollow: 0.05, footslope: 0.1, valley: 0, flat: 0},
       noise: {scale: 160, amp: 1.0}, sink: 0.4, tilt: 0.7}
    - {id: valley_boulders, kind: rock, size: [2.5, 6], foot: 12, base: 0.10, slope: [[0, 0], [6, 0], [14, 1], [34, 1], [42, 0]],
       forms: {hollow: 1.6, footslope: 1.8, valley: 1.2, slope: 0.4, ridge: 0.1, peak: 0.1, flat: 0}, foot_of_cliff: 3.0,
       noise: {scale: 90, amp: 0.9}, sink: 0.3, tilt: 0.6}

base:                                  # common to all biomes; a biome appends layers and overrides them by id
  layers:
    - {id: crags, kind: rock, facet: true, size: [3.0, 7.5], foot: 7.5, base: 0.30, slope: [[0, 0], [38, 0], [50, 1], [85, 1]],
       noise: {scale: 30, amp: 0.9}, dwater: [[0, 0], [2, 1]], droad: [[0, 0], [5, 1]], clear: 6, sink: 0.55, tilt: 1.0}
    - {id: boulders, kind: rock, size: [2.5, 5.5], foot: 7, base: 0.10, slope: [[0, 0.2], [12, 0.5], [25, 1], [55, 1], [70, 0.2]],
       brow: 6, cliff: 0.3, forms: {ridge: 1.6, shoulder: 1.5, spur: 1.3, peak: 1.2, valley: 0.5}, noise: {scale: 40, amp: 0.7},
       dwater: [[0, 0], [2, 0.3], [6, 1]], droad: [[0, 0], [4, 0.1], [8, 1]], clear: 8, sink: 0.4, tilt: 0.6}
    - {id: talus, kind: rock, size: [0.5, 2.0], foot: 1.8, base: 0.45, foot_only: true, slope: [[0, 1], [33, 1], [42, 0]],
       dwater: [[0, 0], [1, 1]], droad: [[0, 0], [3, 0.2], [5, 1]], clear: 4, sink: 0.25, tilt: 0.8}
    - {id: trees, kind: tree, mix: {broad: 0.65, conifer: 0.25, shrub: 0.10}, size: [8, 14], foot: 6.5, base: 0.42,
       slope: [[0, 1], [22, 1], [30, 0.3], [34, 0]], forms: {valley: 1.5, hollow: 1.4, footslope: 1.3, peak: 0.5, ridge: 0.5, shoulder: 0.7},
       noise: {scale: 55, amp: 1.2}, dwater: [[0, 0], [3, 0.4], [7, 1]], droad: [[0, 0], [4, 0], [7, 1]], clear: 12, flat: 0.6, sink: 0.1}
    - {id: shrubs, kind: tree, mix: {shrub: 1}, size: [1.5, 2.8], foot: 2.4, base: 0.05, slope: [[0, 1], [30, 1], [38, 0]],
       children: {of: trees, n: [0, 2], r: [1.0, 1.8]}, dwater: [[0, 0], [1.5, 1]], droad: [[0, 0], [3, 0], [4, 1]], clear: 6}
    - {id: stones, kind: rock, size: [0.3, 0.9], foot: 3.5, base: 0.05, slope: [[0, 1], [35, 1], [45, 0]], noise: {scale: 20, amp: 0.8},
       children: {of: boulders, n: [2, 5], r: [0.6, 1.4]}, dwater: [[0, 0], [1, 1]], droad: [[0, 0], [2.5, 1]], clear: 3, sink: 0.3, tilt: 0.9}

biomes:
  temperate: {}
  jungle:
    layers:
      - {id: trees, mix: {palm: 0.45, broad: 0.45, shrub: 0.10}, base: 0.62, foot: 5.5}
      - {id: shrubs, base: 0.12}
  alpine:
    layers:
      - {id: trees, mix: {conifer: 0.9, shrub: 0.1}, base: 0.30, below_snow: true}
      - {id: boulders, base: 0.16}
      - {id: talus, base: 0.05}
  desert:
    layers:
      - {id: trees, mix: {dead: 0.5, shrub: 0.5}, base: 0.04, size: [2, 6], foot: 9}
      - {id: shrubs, base: 0.02}
      - {id: boulders, base: 0.14}
  volcanic:
    layers:
      - {id: trees, mix: {dead: 1}, base: 0.03, size: [4, 8], foot: 10}
      - {id: shrubs, base: 0.0}
      - {id: boulders, base: 0.13}
  wasteland:
    layers:
      - {id: trees, mix: {dead: 0.8, shrub: 0.2}, base: 0.06, size: [4, 9], foot: 9}
      - {id: shrubs, base: 0.03}
  alien:
    layers:
      - {id: trees, mix: {dead: 0.5, broad: 0.5}, base: 0.15}
