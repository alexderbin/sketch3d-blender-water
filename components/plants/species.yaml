# Plant species knowledge (version 1): one schema for everything that grows — tree, shrub, palm, grass, small plant, flower.
# Sizes are by lifetime (m); the scale canon — a human is 1.8 m. New entries go here, not into the code (like masonry's packs.yaml).
# Read by plants.py (species + age + state + seed → a bl_plant.py specification).
#
# Species fields:
#   name, habit (tree | shrub | palm | herb | grass | flower | fern), biomes — where it grows (site biomes: temperate, alpine, jungle,
#   desert, volcanic, wasteland, alien), height [from, to] — adult, m; width — crown width / height; dbh_h — trunk diameter at the ground
#   / height; tolerance — shade tolerance 0…1 (forest: who grows under the canopy); light — light demand; moist [from, to] — site moisture 0…1;
#   life — lifespan, years (age: young ≤ 0.15, adult, old ≥ 0.7 of the lifespan).
#   trunk, levels — engine knobs (the m_tree engine: TrunkFunction, BranchFunction by orders; engine units, the height is then set by lifetime):
#     trunk: length, start_radius, end_radius, shape (taper), up_attraction, randomness, resolution
#     levels[i]: start/end — where on the parent (0 bottom, 1 top), length, branches_density (per unit length), start_angle (to the parent, °),
#       phillotaxis (°), flatness (0 sphere … 1 flat), up_attraction (toward the light; < 0 — down), gravity_strength + stiffness (sag under
#       weight), split_proba/split_angle (forks), break_chance (breakages), randomness, resolution, start_radius (from the parent),
#       crown_shape (Conical | Spherical | Hemispherical | Cylindrical | TaperedCylindrical | Flame | InverseConical | TendFlame)
#   crown_base — crown bottom / height (for shifting the crown toward the light)
#   leaves: type (the organ image of leaves.py: cluster_* — a leaf cluster, pine/spruce/fir — needles, scale — scale leaves), size (m — a cluster
#     or a needle spray), per_m — cards per metre of thin branches, q — the radius quantile of "thin" branches, up — plane facing the light,
#     angle — angle to the branch (rad), droop, hue — tint [r, g, b]
#   roots: type (plate — flat at the surface, heart — heart-shaped, tap — taproot, buttress — planks, stilt — stilts, none),
#     n — number of main roots, spread — reach in crown radii (k), exposure — the share above ground at the trunk, exposed_len — the visible part
#   bark: c0/c1 — dark and light tone, scale — noise (x, y, z; a smaller z gives furrows along the trunk), bump, rough
#   optics — light through a leaf (leaf_optics.py): set — a PROSPECT-D pigment set (broad, broad_thin, broad_thick, needle,
#     grass, …; none — no optics), gloss — cuticle roughness (less — shinier), under — the underside is lighter by this factor,
#     autumn — the autumn set, blade — the grass-blade set, over — pigment overrides (cab, car, ant, brown, cw, cm, N); the default is optics_default
#   herbaceous: stems [from, to], stem_angle, bend, stem_w, stem_color; leaf {type, size, n, basal, angle, aspect}; blades [from, to],
#     width, spread, clump_r, dry (share of dry ones), color, heads (spikelets); frond {n, len, angle, bend, pinnae, leaflet}; flower {type, size}
version: 1

biomes:                                    # forest density of the biome: a multiplier to the density factor (1 — a moderate forest) and the open share
  temperate: {density: 1.0}
  alpine:    {density: 0.65}
  jungle:    {density: 1.25}
  desert:    {density: 0.12}
  wasteland: {density: 0.1}
  volcanic:  {density: 0.03}
  alien:     {density: 0.5}

optics_default:                            # organ optics by habit (a species overrides it with the optics field): light through a leaf
  tree:   {set: broad, gloss: 0.4, under: 1.3, autumn: autumn_yellow}
  shrub:  {set: broad, gloss: 0.45, under: 1.3, autumn: autumn_yellow}
  palm:   {set: broad_thick, gloss: 0.3, under: 1.15}
  grass:  {set: grass, gloss: 0.45, under: 1.1}
  herb:   {set: broad_thin, gloss: 0.45, under: 1.2}
  flower: {set: broad_thin, gloss: 0.45, under: 1.2}
  fern:   {set: broad_thin, gloss: 0.4, under: 1.15}

habits:                                    # habit defaults (a species overrides them)
  tree:  {woody: {radial: 12, smooth: 2}, crown_base: 0.35, sink: 0.06, life: 200, tolerance: 0.3,
          roots: {type: heart, n: 9, spread: 0.28, exposure: 0.3, exposed_len: 0.35, flare: 1.35}}
  shrub: {woody: {radial: 8, smooth: 1}, crown_base: 0.05, sink: 0.04, life: 40, tolerance: 0.6, roots: {type: none}}
  palm:  {woody: {radial: 12, smooth: 2}, crown_base: 0.9, sink: 0.05, life: 80, tolerance: 0.4,
          roots: {type: plate, n: 14, spread: 0.12, exposure: 0.55, exposed_len: 0.3, flare: 1.5}}
  grass: {sink: 0.0, life: 3, tolerance: 0.5}
  herb:  {sink: 0.0, life: 2, tolerance: 0.5}
  flower: {sink: 0.0, life: 1, tolerance: 0.3}
  fern:  {sink: 0.0, life: 10, tolerance: 0.9}

