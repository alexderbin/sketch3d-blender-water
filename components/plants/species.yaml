# Age and state (plants.resolve): the share of lifespan → multipliers; the state — adjustments on top.
ages:
  seedling: {h: 0.06, dbh: 0.05, leaves: 1.0, roots: 0.0, crown_base: 0.1}
  young:    {h: 0.35, dbh: 0.3, leaves: 1.0, roots: 0.2, crown_base: 0.2}
  adult:    {h: 1.0, dbh: 1.0, leaves: 1.0, roots: 1.0}
  old:      {h: 1.05, dbh: 1.5, leaves: 0.8, roots: 1.6, break_chance: 0.08, exposure: 1.4}
states:
  healthy: {}
  winter:  {leaves: 0}
  dead:    {leaves: 0, break_chance: 0.25, bark: {c0: [0.16, 0.16, 0.15], c1: [0.42, 0.41, 0.38]}}
  broken:  {leaves: 0.7, trunk_cut: 0.55, break_chance: 0.12}
  autumn:  {}                               # autumn colour is the species' pigment set (optics.autumn), not a tint
