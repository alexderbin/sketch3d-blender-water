# Format profiles for the camera move (components/camera/move): numbers, not code. Frame edges are in % of the
# width per second (as in moves_probe), scale in % per second. The ceiling (edge_ceiling, scale_ceiling) is
# the p90 of the speeds of the moving shots of the reference: the move's plateau (p90 over frames) is compared
# against it; exceeding it shortens the move (fit). The usual speed (the median of the shots) is in the
# comment. time — the timing.progress curve; ramp — the fraction of the move for acceleration and braking;
# hold_end — s, the camera stands still before the cut; arc — the usual orbit arc, °; rig — the default rig
# for a hero on the ground and for a landmark. [hyp] — the number was not measured: verify with sheets and by
# measuring references.

trailer:          # 8 3D trailers: shot 1–4 s, static ~45 %; shift of 184 shots — median 3.9, p75 7.5, p90 13.5 %/s;
  shot_s: [1.0, 4.0]  # push-in and pull-back, 71 shots — 5.4 / 9.4 / 21.9 %/s; within a short shot the move is even
  static_share: 0.45
  edge_ceiling: 13.5
  scale_ceiling: 22.0
  time: linear
  ramp: 0.0
  hold_end: 0.0
  arc: [20, 90]
  rig: {hero: steadicam, landmark: drone}

fiction:          # fiction series: static 40 %, arc 30° (21–62), ~11 °/s, ramp 0.1–0.3 s; edges [hyp]: p75 of trailers
  shot_s: [2.0, 6.0]
  static_share: 0.40
  edge_ceiling: 7.5
  scale_ceiling: 9.5
  time: ease
  ramp: 0.12
  hold_end: 0.3
  arc: [20, 60]
  rig: {hero: steadicam, landmark: drone}

lore:             # lore shorts (129 shots): shot 4.7 s, push-in 1.2 %/s (p90 4.3), shift 1.4 %/s (p90 4.2), steady
  shot_s: [3.0, 8.0]
  static_share: 0.38
  edge_ceiling: 4.2
  scale_ceiling: 4.3
  time: linear
  ramp: 0.05
  hold_end: 0.0
  arc: [15, 45]
  rig: {hero: dolly, landmark: drone}

history_short:    # a minute-long history short: after the cut a pull-back ×1.3 (1.1–1.7) over 1.25–2.5 s, then it holds
  shot_s: [2.5, 4.0]
  static_share: 0.10
  edge_ceiling: 8.0
  scale_ceiling: 25.0
  time: settle
  move_share: 0.6
  ramp: 0.0
  hold_end: 0.0
  arc: [10, 30]
  rig: {hero: virtual, landmark: virtual}

documentary:      # documentary episode [hyp]: Burns — slow, with stops; Hollywood — the first shot of a new place 15 s;
  shot_s: [4.0, 12.0] # edges — between lore (4.2) and the p75 of trailers (7.5): a drone orbit at 3–6 °/s gives 5–8 %/s
  static_share: 0.60
  edge_ceiling: 6.0
  scale_ceiling: 4.0
  time: smooth
  ramp: 0.25
  hold_end: 0.5
  arc: [15, 45]
  rig: {hero: dolly, landmark: drone}

comic:            # video comic: REF2 (push-in 0.8 %/s with a ramp), comic dub (3 and 7 %/s), a manga reading rule (hold 2 + 1·heroes + 3·bubbles, s)
  shot_s: [3.0, 8.0]
  static_share: 0.40
  edge_ceiling: 3.5
  scale_ceiling: 5.0
  time: ease
  ramp: 0.2
  hold_end: 0.3
  arc: [10, 30]
  rig: {hero: dolly, landmark: virtual}

# Camera roles (companion, witness, spy, god, self, threat) — defaults for the frame values and the rig [hyp]
roles:
  companion: {yaw: 45, pitch: 3, size: 0.9, lens: 35, rig: steadicam}
  witness:   {yaw: 35, pitch: 6, size: 0.6, lens: 50, rig: tripod}
  spy:       {yaw: 60, pitch: 4, size: 0.5, lens: 100, rig: tripod}
  god:       {yaw: 30, pitch: 60, size: 0.25, lens: 28, rig: drone}
  self:      {yaw: 180, pitch: 0, size: 0.8, lens: 28, rig: handheld}
  threat:    {yaw: 20, pitch: -15, size: 0.8, lens: 35, rig: dolly}
